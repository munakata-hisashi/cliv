name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag and test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Expected tag vMAJOR.MINOR.PATCH" >&2; exit 1; }
          go test ./...
          go vet ./...
      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="cliv_${TAG}_${os}_${arch}"
            mkdir -p "staging/$name"
            binary=cliv
            if [[ "$os" == windows ]]; then binary=cliv.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${TAG#v}" \
              -o "staging/$name/$binary" ./cmd/cliv
            cp LICENSE README.md "staging/$name/"
            if [[ "$os" == windows ]]; then
              (cd staging && zip -qr "../dist/$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C staging "$name"
            fi
          done
          [[ "$(staging/cliv_${TAG}_linux_amd64/cliv --version)" == "cliv ${TAG#v}" ]]
          (cd dist && sha256sum cliv_* > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
